<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="The Magic Whisk - Recipe Extraction and Management App" />
  <title>The Magic Whisk</title>

  <!-- Load Vector Icon Fonts -->
  <link rel="stylesheet" href="./fonts.css" />

  <!-- Inline Font Face Declarations as Backup -->
  <style>
    @font-face {
      font-family: 'Ionicons';
      src: url('./fonts/Ionicons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MaterialIcons';
      src: url('./fonts/MaterialIcons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'MaterialCommunityIcons';
      src: url('./fonts/MaterialCommunityIcons.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    @font-face {
      font-family: 'AntDesign';
      src: url('./fonts/AntDesign.ttf') format('truetype');
      font-weight: normal;
      font-style: normal;
    }

    /* Ensure fonts load with preload hints */
    @supports (font-display: block) {
      @font-face {
        font-family: 'Ionicons';
        src: url('./fonts/Ionicons.ttf') format('truetype');
        font-weight: normal;
        font-style: normal;
        font-display: block;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #root {
      display: flex;
      width: 100%;
      height: 100%;
    }
  </style>

  <!-- Preload critical fonts -->
  <link rel="preload" href="./fonts/Ionicons.ttf" as="font" type="font/ttf" crossorigin />
  <link rel="preload" href="./fonts/MaterialIcons.ttf" as="font" type="font/ttf" crossorigin />
</head>
<body>
  <div id="root"></div>
  <script>
    // Debug: Log when fonts load
    window.addEventListener('load', () => {
      console.log('✅ Page loaded - checking fonts...');
      const fontCheck = setInterval(() => {
        if (document.fonts && document.fonts.status === 'loaded') {
          console.log('✅ All fonts loaded successfully');
          clearInterval(fontCheck);
        }
      }, 100);

      setTimeout(() => clearInterval(fontCheck), 5000);
    });

    // Notify React when fonts are ready
    if (document.fonts) {
      document.fonts.ready.then(() => {
        document.documentElement.setAttribute('data-fonts-loaded', 'true');
        console.log('✅ Document fonts API ready');
      }).catch(err => {
        console.warn('⚠️ Font loading error:', err);
      });
    }
  </script>
</body>
</html>
